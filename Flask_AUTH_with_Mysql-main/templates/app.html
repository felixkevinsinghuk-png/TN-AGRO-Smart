<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flask MySQL</title>

    <!-- Bootstrap 4.6.2 CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

      body {
        font-family: 'Outfit', sans-serif;
        background-color: #0f172a;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-size: cover;
        background-attachment: fixed;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .navbar {
        background: rgba(30, 41, 59, 0.7) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px 30px;
      }
      .navbar-brand,
      .navbar-nav .nav-link {
        color: #f8fafc !important;
      }
      .navbar-nav .nav-link {
        transition: color 0.3s ease, transform 0.3s ease; 
        font-weight: 500;
      }
      .navbar-nav .nav-link:hover {
        color: #f472b6 !important; 
        transform: translateY(-2px);
      }
      .navbar-nav .nav-link.active {
        color: #f472b6 !important;
        font-weight: 600;
      }
      .footer {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        padding: 20px 0;
        text-align: center;
        margin-top: auto;
      }
      .content-section {
        padding: 60px 0;
        flex: 1;
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .glass-card h2, .glass-card h3 {
        background: linear-gradient(135deg, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #a78bfa, #f472b6);
        border: none;
        border-radius: 30px;
        padding: 10px 25px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(244, 114, 182, 0.3);
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(244, 114, 182, 0.5);
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
      }
      .btn-info, .btn-success {
        border-radius: 30px;
        padding: 8px 20px;
        font-weight: 600;
      }
    </style>

    {% block styles %}
    <!-- For adding additional page-specific styles -->
    {% endblock %}
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
      <a class="navbar-brand" href="{{ url_for('index') }}">Flask With MySQL</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('register') }}">Register</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content Block -->
    <div class="content-section">
      {% block content %}
      <!-- Content will be inserted here -->
      {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>
        &copy; 2025 Flask with MySQL | All Rights Reserved under
        <strong>A_N_S_RFA</strong>
      </p>
    </footer>
  </body>
</html>
