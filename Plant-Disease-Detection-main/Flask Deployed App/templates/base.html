<!doctype html>
<html lang="en">
<head>
    <!-- Meta and Bootstrap -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bttn.css/0.2.4/bttn.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>{% block pagetitle %}{% endblock pagetitle %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🌱 AGRO_Smart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/index">AI Engine</a></li>
                    <li class="nav-item"><a class="nav-link" href="/market">Supplements</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact-Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block body %}{% endblock body %}

    <!-- ✅ Chatbot Floating Button -->
    <button id="chatBtn">🤖</button>

    <!-- ✅ Chatbot Window -->
    <div id="chatWindow">
        <div>AGRO Bot</div>
        <div id="chatLog"></div>
        <input type="text" id="chatInput" placeholder="Ask something...">
    </div>

    <!-- ✅ Chatbot Script -->
    <script>
        const chatBtn = document.getElementById("chatBtn");
        const chatWindow = document.getElementById("chatWindow");
        const chatInput = document.getElementById("chatInput");
        const chatLog = document.getElementById("chatLog");

        chatBtn.onclick = () => {
            chatWindow.style.display = chatWindow.style.display === "none" ? "block" : "none";
        };

        chatInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter" && chatInput.value.trim() !== "") {
                const userMessage = chatInput.value;
                chatLog.innerHTML += `<div><b>You:</b> ${userMessage}</div>`;
                fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMessage }),
                })
                .then((res) => res.json())
                .then((data) => {
                    chatLog.innerHTML += `<div><b>AGRO Bot:</b> ${data.reply}</div>`;
                    chatLog.scrollTop = chatLog.scrollHeight;
                });
                chatInput.value = "";
            }
        });
    </script>

    <!-- Footer -->
    <div class="footer-basic">
        <footer>
            <center>
                <!-- Social Media Icons -->
                <div class="text-center my-3">
                    <a href="mailto:krsikx@gmail.com" target="_blank" class="mx-3" style="color: white; font-size: 30px;">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="https://www.instagram.com/krsikx_india/" target="_blank" class="mx-3" style="color: white; font-size: 30px;">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/company/krsikx-india-llp/" target="_blank" class="mx-3" style="color: white; font-size: 30px;">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </center>

          
            <footer style="text-align: center; color: white; padding: 10px; font-family: 'Poppins', sans-serif;">
                &copy; 2025 AGRO_Smart. All rights reserved.
            </footer>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
