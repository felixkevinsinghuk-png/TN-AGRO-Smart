<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AGRO Smart - Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #00e676;
      --primary-dark: #00c853;
      --glass-bg: rgba(15, 25, 17, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f1f3f5;
      --text-muted: #a0aec0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-image: linear-gradient(rgba(10, 17, 12, 0.82), rgba(10, 17, 12, 0.92)),
        url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=2000&auto=format&fit=crop");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
    }

    /* Navbar */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px;
    }
    .navbar-brand {
      color: var(--primary) !important;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }
    .nav-link {
      color: var(--text-main) !important;
      font-weight: 500;
      margin: 0 8px;
      transition: color 0.3s ease;
      position: relative;
    }
    .nav-link:hover { color: var(--primary) !important; }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0; height: 2px;
      bottom: 0; left: 0;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* User pill */
    .user-pill {
      background: rgba(0,230,118,0.1);
      border: 1px solid rgba(0,230,118,0.3);
      border-radius: 30px;
      padding: 6px 18px;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .logout-btn {
      background: transparent;
      color: #ff5252;
      border: 1px solid #ff5252;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .logout-btn:hover { background: #ff5252; color: #fff; }

    /* Hero */
    .hero-section {
      text-align: center;
      padding: 60px 20px 20px;
    }
    .hero-section h1 {
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .hero-section p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 0;
    }

    /* Carousel */
    .carousel-wrapper {
      max-width: 85%;
      margin: 40px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
    }
    .carousel-item img {
      height: 420px;
      object-fit: cover;
    }

    /* Stats strip */
    .stats-strip {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 85%;
      margin: 0 auto 30px;
    }
    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 35px;
      text-align: center;
      flex: 1;
      min-width: 150px;
    }
    .stat-card h2 {
      color: var(--primary);
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
    }
    .stat-card p { color: var(--text-muted); margin: 4px 0 0; font-size: 0.85rem; }

    /* CTA Button */
    .btn-premium {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #000;
      border: none;
      padding: 14px 55px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 25px rgba(0, 230, 118, 0.4);
      cursor: pointer;
    }
    .btn-premium:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgba(0, 230, 118, 0.6);
    }
  </style>
  <script type="module" src="{{ url_for('static', filename='homepage.js') }}"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand">🌱 AGRO_Smart</a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="user-pill">👤 Welcome, <span id="loggedUserFName">User</span></span>
        <button class="logout-btn" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="hero-section">
    <h1>🍁 AGRO_Smart 🍁</h1>
    <p>AI-Powered Plant Disease Detection — Upload a leaf image and get instant diagnosis</p>
  </div>

  <!-- Carousel -->
  <div id="agroCarousel" class="carousel slide carousel-wrapper" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=1470" class="d-block w-100" alt="Farming">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?q=80&w=1470" class="d-block w-100" alt="Plants">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=1470" class="d-block w-100" alt="Garden">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#agroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#agroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat-card">
      <h2>39</h2>
      <p>Disease Classes</p>
    </div>
    <div class="stat-card">
      <h2>98%</h2>
      <p>Detection Accuracy</p>
    </div>
    <div class="stat-card">
      <h2>14+</h2>
      <p>Plant Species</p>
    </div>
    <div class="stat-card">
      <h2>AI</h2>
      <p>Powered by CNN</p>
    </div>
  </div>

  <!-- User Info + CTA -->
  <div style="max-width: 85%; margin: 0 auto 60px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
    <div>
      <p style="color: var(--text-muted); margin: 0 0 4px; font-size: 0.9rem;">Logged in as</p>
      <p style="color: var(--text-main); margin: 0; font-size: 1.1rem; font-weight: 600;">
        <span id="loggedUserFName"></span>&nbsp;<span id="loggedUserLName"></span>
      </p>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin: 4px 0 0;"><span id="loggedUserEmail"></span></p>
    </div>
    <a href="/ai-engine">
      <button class="btn-premium">🌿 Launch AI Engine</button>
    </a>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const carousel = document.querySelector('#agroCarousel');
    if (carousel) {
      new bootstrap.Carousel(carousel, { interval: 3000, ride: 'carousel' });
    }
  </script>

</body>
</html>
